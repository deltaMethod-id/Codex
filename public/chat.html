<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat — Codex</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --sidebar: #0b0b0b;
      --panel: #101010;
      --panel-2: #141414;
      --border: #242424;
      --border-light: #303030;
      --text: #eeeeee;
      --muted: #8a8a8a;
      --muted-2: #666;
      --white: #fff;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    /* =========================
       APP
       ========================= */

    .app {
      width: 100%;
      height: 100vh;

      display: flex;
    }

    /* =========================
       SIDEBAR
       ========================= */

    aside {
      width: 250px;
      height: 100vh;

      padding: 18px;

      flex-shrink: 0;

      background: var(--sidebar);
      border-right: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;

      height: 42px;

      margin-bottom: 24px;

      padding: 0 10px;

      color: #fff;

      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .new-chat {
      display: flex;
      align-items: center;
      gap: 9px;

      width: 100%;

      padding: 11px 13px;

      margin-bottom: 12px;

      color: #ddd;

      background: #151515;

      border: 1px solid #252525;
      border-radius: 10px;

      cursor: pointer;

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
    }

    .new-chat:hover {
      background: #1b1b1b;
      border-color: #353535;
    }

    .new-chat:active {
      transform: scale(.98);
    }

    .nav-title {
      margin: 20px 10px 7px;

      color: #555;

      font-size: 11px;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: .08em;
    }

    aside a,
    aside button {
      text-decoration: none;

      display: flex;
      align-items: center;
      gap: 9px;

      width: 100%;

      padding: 10px 11px;

      color: #929292;

      background: transparent;

      border: 0;
      border-radius: 9px;

      text-align: left;

      cursor: pointer;

      font-size: 14px;

      transition:
        background .18s ease,
        color .18s ease;
    }

    aside a:hover,
    aside button:hover {
      color: #fff;
      background: #161616;
    }

    .nav-icon {
      width: 18px;

      text-align: center;

      color: #777;
    }

    /* =========================
       MAIN
       ========================= */

    main {
      min-width: 0;
      min-height: 0;

      flex: 1;

      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
       ========================= */

    header {
      height: 62px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 25px;

      background: rgba(8, 8, 8, .92);

      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(12px);

      z-index: 10;
    }

    .model-info {
      display: flex;
      align-items: center;
      gap: 9px;

      color: #bdbdbd;

      font-size: 14px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #777;

      box-shadow:
        0 0 0 3px rgba(255,255,255,.035);
    }

    /* =========================
       MESSAGES
       ========================= */

    #messages {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding:
        34px 24px 180px;

      scrollbar-width: thin;
      scrollbar-color: #292929 transparent;
    }

    #messages::-webkit-scrollbar {
      width: 7px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #292929;
      border-radius: 20px;
    }

    .message {
      width: min(820px, 100%);

      margin:
        0 auto 20px;

      display: flex;

      gap: 13px;
    }

    .avatar {
      width: 34px;
      height: 34px;

      flex: 0 0 34px;

      display: grid;
      place-items: center;

      overflow: hidden;

      color: #ddd;

      background: #111;

      border: 1px solid #303030;
      border-radius: 10px;

      font-size: 11px;
      font-weight: 700;
    }

    .avatar.ai {
      background: #151515;

      font-size: 15px;
    }

    .avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    /* =========================
       MESSAGE CARD
       ========================= */

    .message-card {
      min-width: 0;
      flex: 1;

      padding: 15px 17px;

      background: #0e0e0e;

      border: 1px solid #222;
      border-radius: 14px;

      box-shadow:
        0 4px 20px rgba(0,0,0,.12);
    }

    .message.user .message-card {
      background: #111;

      border-color: #292929;
    }

    .role {
      margin-bottom: 9px;

      color: #ddd;

      font-size: 12px;
      font-weight: 700;
    }

    .message.user .role {
      color: #aaa;
    }

    /* =========================
       MARKDOWN
       ========================= */

    .content {
      min-width: 0;

      color: #e5e5e5;

      font-size: 15px;
      line-height: 1.72;

      overflow-wrap: anywhere;
    }

    .content > :first-child {
      margin-top: 0;
    }

    .content > :last-child {
      margin-bottom: 0;
    }

    .content p {
      margin: 0 0 14px;
    }

    .content h1,
    .content h2,
    .content h3,
    .content h4 {
      color: #fff;

      line-height: 1.3;

      margin:
        20px 0 10px;

      letter-spacing: -.02em;
    }

    .content h1 {
      font-size: 25px;
    }

    .content h2 {
      font-size: 21px;
    }

    .content h3 {
      font-size: 18px;
    }

    .content h4 {
      font-size: 16px;
    }

    .content ul,
    .content ol {
      margin:
        8px 0 16px;

      padding-left: 25px;
    }

    .content li {
      margin: 5px 0;
    }

    .content li::marker {
      color: #777;
    }

    .content strong {
      color: #fff;
      font-weight: 700;
    }

    .content em {
      color: #cfcfcf;
    }

    .content del {
      color: #777;
    }

    .content blockquote {
      margin:
        15px 0;

      padding:
        9px 15px;

      color: #aaa;

      background: #121212;

      border-left:
        3px solid #444;

      border-radius: 0 8px 8px 0;
    }

    .content a {
      color: #ddd;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .content a:hover {
      color: #fff;
    }

    /* Inline code */

    .content code.inline-code {
      padding:
        2px 6px;

      color: #ddd;

      background: #181818;

      border: 1px solid #292929;
      border-radius: 6px;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: .88em;
    }

    /* Code blocks */

    .code-block {
      margin:
        16px 0;

      overflow: hidden;

      background: #090909;

      border: 1px solid #292929;
      border-radius: 11px;
    }

    .code-header {
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 12px;

      background: #111;

      border-bottom: 1px solid #252525;
    }

    .code-language {
      color: #777;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 11px;

      text-transform: uppercase;
    }

    .copy-code {
      padding: 5px 8px;

      color: #888;

      background: transparent;

      border: 1px solid #292929;
      border-radius: 6px;

      cursor: pointer;

      font-size: 11px;
    }

    .copy-code:hover {
      color: #fff;
      background: #181818;
    }

    .code-block pre {
      margin: 0;

      padding: 15px;

      overflow-x: auto;

      color: #ddd;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 13px;

      line-height: 1.65;

      scrollbar-width: thin;
    }

    /* Tables */

    .table-wrap {
      width: 100%;

      margin:
        16px 0;

      overflow-x: auto;

      border: 1px solid #292929;

      border-radius: 10px;
    }

    .content table {
      width: 100%;

      border-collapse: collapse;

      min-width: 480px;

      font-size: 13px;
    }

    .content th,
    .content td {
      padding:
        10px 12px;

      border-bottom: 1px solid #242424;

      border-right: 1px solid #242424;

      text-align: left;
    }

    .content th {
      color: #eee;

      background: #151515;

      font-weight: 700;
    }

    .content td {
      color: #aaa;
      background: #0d0d0d;
    }

    .content tr:last-child td {
      border-bottom: 0;
    }

    .content th:last-child,
    .content td:last-child {
      border-right: 0;
    }

    /* Horizontal rule */

    .content hr {
      margin:
        20px 0;

      border: 0;

      border-top:
        1px solid #292929;
    }

    /* =========================
       EMPTY STATE
       ========================= */

    .empty {
      width: min(650px, 100%);

      margin:
        18vh auto 0;

      text-align: center;
    }

    .empty-icon {
      width: 50px;
      height: 50px;

      display: grid;
      place-items: center;

      margin:
        0 auto 18px;

      color: #ddd;

      background: #111;

      border: 1px solid #292929;
      border-radius: 14px;

      font-size: 20px;
    }

    .empty h2 {
      margin: 0 0 8px;

      color: #eee;

      font-size: 25px;
      letter-spacing: -.03em;
    }

    .empty p {
      margin: 0;

      color: #666;

      font-size: 14px;
    }

    /* =========================
       COMPOSER
       ========================= */

    .composer-wrap {
      position: fixed;

      left: 250px;
      right: 0;
      bottom: 0;

      padding:
        18px 24px 22px;

      background:
        linear-gradient(
          transparent,
          rgba(8,8,8,.96) 35%
        );

      z-index: 20;
    }

    .composer {
      width: min(820px, 100%);

      min-height: 58px;

      margin: auto;

      display: flex;
      align-items: flex-end;

      padding: 8px;

      background: #111;

      border: 1px solid #303030;
      border-radius: 15px;

      box-shadow:
        0 15px 50px rgba(0,0,0,.35);

      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .composer:focus-within {
      border-color: #414141;

      box-shadow:
        0 15px 50px rgba(0,0,0,.4),
        0 0 0 1px rgba(255,255,255,.025);
    }

    textarea {
      flex: 1;

      width: 100%;

      min-height: 40px;
      max-height: 160px;

      padding:
        10px 12px;

      resize: none;

      color: #fff;

      background: transparent;

      border: 0;
      outline: 0;

      line-height: 1.5;
    }

    textarea::placeholder {
      color: #666;
    }

    .send {
      width: 40px;
      height: 40px;

      flex: 0 0 40px;

      display: grid;
      place-items: center;

      color: #000;

      background: #fff;

      border: 0;
      border-radius: 10px;

      cursor: pointer;

      font-size: 18px;
      font-weight: 800;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .send:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .send:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 700px) {

      aside {
        display: none;
      }

      header {
        padding:
          0 15px;
      }

      #messages {
        padding:
          25px 12px 150px;
      }

      .message {
        gap: 9px;
      }

      .message-card {
        padding:
          13px 14px;
      }

      .content {
        font-size: 14px;
      }

      .composer-wrap {
        left: 0;

        padding:
          12px 12px 16px;
      }

      .empty {
        margin-top: 15vh;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside>

    <div class="logo">
      Codex
    </div>

    <button
      class="new-chat"
      type="button"
      onclick="newChat()"
    >
      <span>＋</span>
      <span>New chat</span>
    </button>

    <div class="nav-title">
      Workspace
    </div>

    <a href="/dashboard">
      <span class="nav-icon">⌂</span>
      <span>Dashboard</span>
    </a>

    <a href="/settings">
      <span class="nav-icon">⚙</span>
      <span>Settings</span>
    </a>

  </aside>


  <main>

    <header>

      <div class="model-info">
        <span class="status-dot"></span>
        <span>Nemotron 3 Ultra · OpenRouter</span>
      </div>

    </header>


    <div id="messages"></div>


    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="input"
          rows="1"
          maxlength="20000"
          placeholder="Message Codex..."
          autocomplete="off"
        ></textarea>

        <button
          class="send"
          id="send"
          type="button"
          aria-label="Send message"
        >
          ↑
        </button>

      </div>

    </div>

  </main>

</div>


<script>
  /*
   * ==========================
   * AUTH
   * ==========================
   */

  let user = null;

  try {
    user = JSON.parse(
      localStorage.getItem(
        "codex_user"
      ) || "null"
    );
  } catch {
    user = null;
  }

  if (!user) {
    location.replace("/auth");
  }


  /*
   * ==========================
   * STATE
   * ==========================
   */

  let messages = [];

  try {
    messages = JSON.parse(
      localStorage.getItem(
        "codex_messages"
      ) || "[]"
    );

    if (!Array.isArray(messages)) {
      messages = [];
    }
  } catch {
    messages = [];
  }

  let loading = false;


  /*
   * ==========================
   * ELEMENTS
   * ==========================
   */

  const messageBox =
    document.getElementById(
      "messages"
    );

  const input =
    document.getElementById(
      "input"
    );

  const sendButton =
    document.getElementById(
      "send"
    );


  /*
   * ==========================
   * HTML ESCAPE
   * ==========================
   */

  function escapeHTML(value) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      String(value ?? "");

    return div.innerHTML;
  }


  /*
   * ==========================
   * MARKDOWN PARSER
   *
   * Supports:
   * - headings
   * - bold
   * - italic
   * - lists
   * - blockquotes
   * - inline code
   * - code blocks
   * - tables
   * - links
   * - horizontal rules
   * ==========================
   */

  function parseMarkdown(text) {

    let source =
      String(text ?? "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");


    const codeBlocks = [];

    /*
     * Protect fenced code blocks
     */

    source =
      source.replace(
        /```([a-zA-Z0-9_+#.-]*)\n?([\s\S]*?)```/g,
        (_, language, code) => {

          const id =
            `CODEBLOCK_${codeBlocks.length}`;

          codeBlocks.push({
            language:
              language || "code",

            code:
              code.replace(/\n$/, "")
          });

          return `\n${id}\n`;
        }
      );


    /*
     * Escape HTML first.
     */

    source =
      escapeHTML(source);


    /*
     * Tables
     */

    source =
      parseTables(source);


    /*
     * Headings
     */

    source =
      source.replace(
        /^###### (.+)$/gm,
        "<h4>$1</h4>"
      );

    source =
      source.replace(
        /^##### (.+)$/gm,
        "<h4>$1</h4>"
      );

    source =
      source.replace(
        /^#### (.+)$/gm,
        "<h4>$1</h4>"
      );

    source =
      source.replace(
        /^### (.+)$/gm,
        "<h3>$1</h3>"
      );

    source =
      source.replace(
        /^## (.+)$/gm,
        "<h2>$1</h2>"
      );

    source =
      source.replace(
        /^# (.+)$/gm,
        "<h1>$1</h1>"
      );


    /*
     * Horizontal rule
     */

    source =
      source.replace(
        /^(\*\s*){3,}$/gm,
        "<hr>"
      );

    source =
      source.replace(
        /^(-\s*){3,}$/gm,
        "<hr>"
      );


    /*
     * Blockquotes
     */

    source =
      source.replace(
        /^&gt; (.+)$/gm,
        "<blockquote>$1</blockquote>"
      );


    /*
     * Unordered lists
     */

    source =
      source.replace(
        /(?:^|\n)((?:[-*+] .+(?:\n|$))+)/g,
        (_, block) => {

          const items =
            block
              .trim()
              .split("\n")
              .map(
                item =>
                  item.replace(
                    /^[-*+] (.+)$/,
                    "<li>$1</li>"
                  )
              )
              .join("");

          return `\n<ul>${items}</ul>\n`;
        }
      );


    /*
     * Ordered lists
     */

    source =
      source.replace(
        /(?:^|\n)((?:\d+\. .+(?:\n|$))+)/g,
        (_, block) => {

          const items =
            block
              .trim()
              .split("\n")
              .map(
                item =>
                  item.replace(
                    /^\d+\. (.+)$/,
                    "<li>$1</li>"
                  )
              )
              .join("");

          return `\n<ol>${items}</ol>\n`;
        }
      );


    /*
     * Inline code
     */

    source =
      source.replace(
        /`([^`\n]+)`/g,
        '<code class="inline-code">$1</code>'
      );


    /*
     * Bold
     */

    source =
      source.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
      );

    source =
      source.replace(
        /__(.+?)__/g,
        "<strong>$1</strong>"
      );


    /*
     * Italic
     */

    source =
      source.replace(
        /(^|[^\*])\*([^*\n]+)\*(?!\*)/g,
        "$1<em>$2</em>"
      );


    /*
     * Strikethrough
     */

    source =
      source.replace(
        /~~(.+?)~~/g,
        "<del>$1</del>"
      );


    /*
     * Links
     *
     * Only allow http(s).
     */

    source =
      source.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        (_, label, url) => {

          const safeURL =
            escapeHTML(url);

          return `
            <a
              href="${safeURL}"
              target="_blank"
              rel="noopener noreferrer"
            >${label}</a>
          `;
        }
      );


    /*
     * Paragraphs / line breaks
     */

    source =
      source.replace(
        /\n{2,}/g,
        "</p><p>"
      );

    source =
      source.replace(
        /\n/g,
        "<br>"
      );


    /*
     * Avoid wrapping block elements
     * incorrectly.
     */

    source =
      source.replace(
        /<br>(?=<\/?(?:h[1-4]|ul|ol|blockquote|pre|table|hr))/g,
        ""
      );

    source =
      source.replace(
        /(<\/(?:h[1-4]|ul|ol|blockquote|pre|table|hr)>)<br>/g,
        "$1"
      );


    /*
     * Restore code blocks
     */

    codeBlocks.forEach(
      (block, index) => {

        const token =
          `CODEBLOCK_${index}`;

        const language =
          escapeHTML(
            block.language
          );

        const code =
          escapeHTML(
            block.code
          );

        const html = `
          <div class="code-block">

            <div class="code-header">

              <span class="code-language">
                ${language}
              </span>

              <button
                class="copy-code"
                type="button"
                data-code="${escapeHTML(block.code)}"
              >
                Copy
              </button>

            </div>

            <pre><code>${code}</code></pre>

          </div>
        `;

        source =
          source.replace(
            token,
            html
          );
      }
    );


    /*
     * Wrap normal text as paragraph.
     */

    if (
      !source.includes("<p>") &&
      source.trim()
    ) {
      source =
        `<p>${source}</p>`;
    }


    return source;
  }


  /*
   * ==========================
   * TABLE PARSER
   * ==========================
   */

  function parseTables(source) {

    const lines =
      source.split("\n");

    const output = [];

    let i = 0;

    while (
      i < lines.length
    ) {

      const header =
        lines[i];

      const separator =
        lines[i + 1];


      const isTable =
        header &&
        separator &&
        header.includes("|") &&
        /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/
          .test(separator);


      if (!isTable) {

        output.push(header);

        i++;

        continue;
      }


      const parseRow =
        (line) => {

          let row =
            line.trim();

          if (row.startsWith("|")) {
            row = row.slice(1);
          }

          if (row.endsWith("|")) {
            row =
              row.slice(0, -1);
          }

          return row
            .split("|")
            .map(
              cell =>
                cell.trim()
            );
        };


      const headers =
        parseRow(header);


      const rows = [];

      i += 2;


      while (
        i < lines.length &&
        lines[i].includes("|") &&
        lines[i].trim()
      ) {

        rows.push(
          parseRow(
            lines[i]
          )
        );

        i++;
      }


      let table =
        '<div class="table-wrap"><table>';


      table += "<thead><tr>";

      headers.forEach(
        cell => {
          table +=
            `<th>${cell}</th>`;
        }
      );

      table += "</tr></thead>";


      if (rows.length) {

        table += "<tbody>";

        rows.forEach(
          row => {

            table += "<tr>";

            headers.forEach(
              (_, index) => {

                table +=
                  `<td>${row[index] || ""}</td>`;

              }
            );

            table += "</tr>";

          }
        );

        table += "</tbody>";
      }


      table +=
        "</table></div>";


      output.push(table);
    }


    return output.join("\n");
  }


  /*
   * ==========================
   * SAVE
   * ==========================
   */

  function save() {

    localStorage.setItem(
      "codex_messages",
      JSON.stringify(
        messages
      )
    );
  }


  /*
   * ==========================
   * RENDER
   * ==========================
   */

  function render() {

    if (!messages.length) {

      messageBox.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            ✦
          </div>

          <h2>
            What can I help with?
          </h2>

          <p>
            Ask Codex anything.
          </p>

        </div>
      `;

      return;
    }


    messageBox.innerHTML =
      messages
        .map(
          (message) => {

            const isUser =
              message.role ===
              "user";


            let avatar =
              isUser
                ? "You"
                : "✦";


            if (
              isUser &&
              user?.photo
            ) {

              avatar = `
                <img
                  src="${escapeHTML(
                    user.photo
                  )}"
                  alt="User"
                >
              `;

            }


            const role =
              isUser
                ? escapeHTML(
                    user?.name ||
                    "You"
                  )
                : "Codex";


            const content =
              isUser
                ? `<p>${escapeHTML(
                    message.content
                  )}</p>`
                : parseMarkdown(
                    message.content
                  );


            return `
              <div
                class="message ${
                  isUser
                    ? "user"
                    : "assistant"
                }"
              >

                <div
                  class="avatar ${
                    isUser
                      ? ""
                      : "ai"
                  }"
                >
                  ${avatar}
                </div>


                <div
                  class="message-card"
                >

                  <div class="role">
                    ${role}
                  </div>

                  <div class="content">
                    ${content}
                  </div>

                </div>

              </div>
            `;
          }
        )
        .join("");


    /*
     * Code copy buttons
     */

    messageBox
      .querySelectorAll(
        ".copy-code"
      )
      .forEach(
        (button) => {

          button.addEventListener(
            "click",
            async () => {

              const code =
                button
                  .getAttribute(
                    "data-code"
                  ) || "";


              try {

                await navigator.clipboard
                  .writeText(code);

                button.textContent =
                  "Copied";

                setTimeout(
                  () => {
                    button.textContent =
                      "Copy";
                  },
                  1200
                );

              } catch {

                button.textContent =
                  "Failed";

              }

            }
          );

        }
      );


    messageBox.scrollTop =
      messageBox.scrollHeight;
  }


  /*
   * ==========================
   * SEND MESSAGE
   * ==========================
   */

  async function sendMessage() {

    const text =
      input.value.trim();


    if (
      !text ||
      loading
    ) {
      return;
    }


    messages.push({
      role: "user",
      content: text
    });


    input.value = "";

    input.style.height =
      "auto";


    save();
    render();


    loading = true;

    sendButton.disabled =
      true;


    const loadingMessage = {
      role: "assistant",
      content:
        "Thinking..."
    };


    messages.push(
      loadingMessage
    );

    render();


    try {

      const apiMessages =
        messages.slice(
          0,
          -1
        );


      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                messages:
                  apiMessages
              })
          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "Server mengirim response yang tidak valid."
        );

      }


      if (!response.ok) {

        throw new Error(
          data?.error ||
          `Request gagal (${response.status})`
        );

      }


      if (
        typeof data?.content !==
        "string"
      ) {

        throw new Error(
          "Respons model tidak valid."
        );

      }


      loadingMessage.content =
        data.content;


      save();
      render();


    } catch (error) {

      console.error(
        "Codex error:",
        error
      );


      loadingMessage.content =
        "Error: " +
        error.message;


      save();
      render();


    } finally {

      loading = false;

      sendButton.disabled =
        false;

      input.focus();

    }
  }


  /*
   * ==========================
   * NEW CHAT
   * ==========================
   */

  function newChat() {

    if (
      messages.length &&
      !confirm(
        "Hapus percakapan saat ini?"
      )
    ) {
      return;
    }


    messages = [];


    localStorage.removeItem(
      "codex_messages"
    );


    render();

    input.focus();
  }


  /*
   * ==========================
   * EVENTS
   * ==========================
   */

  sendButton.addEventListener(
    "click",
    sendMessage
  );


  input.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  input.addEventListener(
    "input",
    () => {

      input.style.height =
        "auto";


      input.style.height =
        Math.min(
          input.scrollHeight,
          160
        ) + "px";

    }
  );


  /*
   * ==========================
   * START
   * ==========================
   */

  render();

  input.focus();
</script>

</body>
</html>
