<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat — Codex</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;

      background: #080808;
      color: #eee;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .app {
      height: 100vh;
      display: flex;
    }

    aside {
      width: 240px;
      padding: 20px;

      background: #0c0c0c;
      border-right: 1px solid #1f1f1f;

      flex-shrink: 0;
    }

    .logo {
      font-weight: 900;
      font-size: 20px;
      margin-bottom: 30px;
    }

    aside a,
    aside button {
      display: block;
      width: 100%;

      color: #aaa;
      text-decoration: none;

      background: none;
      border: 0;

      text-align: left;

      padding: 11px;
      margin-bottom: 4px;

      border-radius: 8px;

      cursor: pointer;

      font: inherit;
      font-size: 14px;
    }

    aside a:hover,
    aside button:hover {
      background: #171717;
      color: #fff;
    }

    main {
      flex: 1;

      display: flex;
      flex-direction: column;

      min-width: 0;
      min-height: 0;
    }

    header {
      height: 60px;

      flex-shrink: 0;

      border-bottom: 1px solid #1d1d1d;

      display: flex;
      align-items: center;

      padding: 0 25px;

      color: #aaa;
      font-size: 14px;
    }

    #messages {
      flex: 1;

      overflow-y: auto;

      padding:
        35px 20px 150px;

      scroll-behavior: smooth;
    }

    .message {
      max-width: 780px;

      margin:
        0 auto 28px;

      display: flex;

      gap: 14px;

      line-height: 1.7;
    }

    .avatar {
      width: 32px;
      height: 32px;

      flex: 0 0 32px;

      border: 1px solid #333;
      border-radius: 9px;

      display: grid;
      place-items: center;

      font-size: 12px;

      overflow: hidden;

      background: #111;
    }

    .avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;

      color: #eee;
    }

    .role {
      font-size: 13px;
      font-weight: 700;

      margin-bottom: 5px;

      color: #fff;
    }

    .composer-wrap {
      position: fixed;

      bottom: 0;

      left: 240px;
      right: 0;

      padding: 20px;

      background:
        linear-gradient(
          transparent,
          #080808 30%
        );

      z-index: 5;
    }

    .composer {
      max-width: 780px;

      margin: auto;

      border: 1px solid #303030;
      border-radius: 16px;

      background: #111;

      display: flex;
      align-items: flex-end;

      padding: 10px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .composer:focus-within {
      border-color: #444;

      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03);
    }

    textarea {
      flex: 1;

      width: 100%;

      resize: none;

      border: 0;
      outline: none;

      background: transparent;
      color: #fff;

      font: inherit;

      padding: 10px;

      max-height: 160px;

      line-height: 1.5;
    }

    textarea::placeholder {
      color: #666;
    }

    .send {
      width: 40px;
      height: 40px;

      flex: 0 0 40px;

      border: 0;
      border-radius: 10px;

      background: #fff;
      color: #000;

      font-size: 18px;
      font-weight: 700;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .send:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .send:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;

      color: #777;

      margin-top: 20vh;
    }

    .empty h2 {
      margin-bottom: 8px;

      color: #ddd;
      font-size: 24px;
    }

    .empty p {
      margin: 0;

      color: #666;
    }

    .error {
      color: #ff7777;
    }

    @media (max-width: 700px) {
      aside {
        display: none;
      }

      header {
        padding: 0 16px;
      }

      .composer-wrap {
        left: 0;

        padding:
          12px 12px 16px;
      }

      #messages {
        padding:
          25px 14px 130px;
      }

      .message {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside>

    <div class="logo">
      Codex
    </div>

    <button
      type="button"
      onclick="newChat()"
    >
      ＋ New chat
    </button>

    <a href="/dashboard">
      Dashboard
    </a>

    <a href="/settings">
      Settings
    </a>

  </aside>


  <main>

    <header>
      Nemotron 3 Ultra · OpenRouter
    </header>


    <div id="messages"></div>


    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="input"
          rows="1"
          maxlength="20000"
          placeholder="Message Codex..."
          autocomplete="off"
        ></textarea>

        <button
          class="send"
          id="send"
          type="button"
          aria-label="Send message"
        >
          ↑
        </button>

      </div>

    </div>

  </main>

</div>


<script>
  /*
   * ==========================
   * AUTH
   * ==========================
   */

  const user = JSON.parse(
    localStorage.getItem("codex_user") || "null"
  );

  if (!user) {
    location.replace("/auth");
  }


  /*
   * ==========================
   * CHAT STATE
   * ==========================
   */

  let messages = JSON.parse(
    localStorage.getItem(
      "codex_messages"
    ) || "[]"
  );

  let loading = false;


  /*
   * ==========================
   * ELEMENTS
   * ==========================
   */

  const messageBox =
    document.getElementById(
      "messages"
    );

  const input =
    document.getElementById(
      "input"
    );

  const sendButton =
    document.getElementById(
      "send"
    );


  /*
   * ==========================
   * ESCAPE HTML
   * ==========================
   */

  function escapeHTML(value) {
    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      String(value ?? "");

    return div.innerHTML;
  }


  /*
   * ==========================
   * SAVE
   * ==========================
   */

  function save() {
    localStorage.setItem(
      "codex_messages",
      JSON.stringify(messages)
    );
  }


  /*
   * ==========================
   * RENDER
   * ==========================
   */

  function render() {

    if (!messages.length) {

      messageBox.innerHTML = `
        <div class="empty">
          <h2>
            What can I help with?
          </h2>

          <p>
            Ask Codex anything.
          </p>
        </div>
      `;

      return;
    }


    messageBox.innerHTML =
      messages
        .map((message) => {

          const isUser =
            message.role === "user";


          let avatar =
            isUser
              ? "You"
              : "✦";


          if (
            isUser &&
            user?.photo
          ) {

            avatar = `
              <img
                src="${escapeHTML(user.photo)}"
                alt="User"
              >
            `;

          }


          const role =
            isUser
              ? escapeHTML(
                  user?.name ||
                  "You"
                )
              : "Codex";


          const content =
            escapeHTML(
              message.content
            );


          return `
            <div class="message">

              <div class="avatar">
                ${avatar}
              </div>

              <div>

                <div class="role">
                  ${role}
                </div>

                <div class="content">
                  ${content}
                </div>

              </div>

            </div>
          `;

        })
        .join("");


    messageBox.scrollTop =
      messageBox.scrollHeight;
  }


  /*
   * ==========================
   * SEND MESSAGE
   * ==========================
   */

  async function sendMessage() {

    const text =
      input.value.trim();


    if (
      !text ||
      loading
    ) {
      return;
    }


    /*
     * User message
     */

    messages.push({
      role: "user",
      content: text
    });


    input.value = "";

    input.style.height =
      "auto";


    save();
    render();


    /*
     * Loading
     */

    loading = true;

    sendButton.disabled =
      true;


    const loadingMessage = {
      role: "assistant",
      content: "Thinking..."
    };


    messages.push(
      loadingMessage
    );

    render();


    try {

      /*
       * Jangan kirim
       * "Thinking..." ke server.
       */

      const apiMessages =
        messages.slice(
          0,
          -1
        );


      /*
       * Vercel Function
       *
       * /api/chat
       *       ↓
       * server.js
       *       ↓
       * OpenRouter
       */

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                messages:
                  apiMessages
              })
          }
        );


      let data;

      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "Server mengirim response yang tidak valid."
        );

      }


      /*
       * API error
       */

      if (!response.ok) {

        throw new Error(
          data?.error ||
          `Request gagal (${response.status})`
        );

      }


      /*
       * Model response
       */

      if (
        typeof data?.content !==
        "string"
      ) {

        throw new Error(
          "Respons model tidak valid."
        );

      }


      loadingMessage.content =
        data.content;


      save();
      render();


    } catch (error) {

      console.error(
        "Codex error:",
        error
      );


      loadingMessage.content =
        "Error: " +
        error.message;


      save();
      render();


    } finally {

      loading = false;

      sendButton.disabled =
        false;

      input.focus();

    }
  }


  /*
   * ==========================
   * NEW CHAT
   * ==========================
   */

  function newChat() {

    if (
      messages.length &&
      !confirm(
        "Hapus percakapan saat ini?"
      )
    ) {
      return;
    }


    messages = [];


    localStorage.removeItem(
      "codex_messages"
    );


    render();

    input.focus();
  }


  /*
   * ==========================
   * SEND BUTTON
   * ==========================
   */

  sendButton.addEventListener(
    "click",
    sendMessage
  );


  /*
   * ==========================
   * ENTER TO SEND
   * ==========================
   */

  input.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /*
   * ==========================
   * AUTO RESIZE
   * ==========================
   */

  input.addEventListener(
    "input",
    () => {

      input.style.height =
        "auto";


      input.style.height =
        Math.min(
          input.scrollHeight,
          160
        ) + "px";

    }
  );


  /*
   * ==========================
   * INITIAL RENDER
   * ==========================
   */

  render();

  input.focus();
</script>

</body>
</html>
