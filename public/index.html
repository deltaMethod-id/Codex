<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080808">
  <meta name="description" content="Codex — AI Assistant powered by Nemotron">

  <title>Codex — AI Assistant</title>

  <style>
    :root {
      --bg: #080808;
      --surface: #111111;
      --border: #222222;
      --text: #ffffff;
      --muted: #999999;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    a {
      -webkit-tap-highlight-color: transparent;
    }

    nav {
      width: 100%;
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      border-bottom: 1px solid var(--border);
      background: rgba(8, 8, 8, 0.85);

      position: relative;
      z-index: 10;
    }

    .nav-inner {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;

      min-height: 44px;
      padding: 11px 18px;

      border: 1px solid transparent;
      border-radius: 10px;

      text-decoration: none;
      color: #000;
      background: #fff;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #f0f0f0;
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.08);
    }

    .btn:active {
      transform: translateY(0);
    }

    .hero {
      width: 100%;
      min-height: calc(100vh - 70px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 60px 20px;
      text-align: center;

      position: relative;
      overflow: hidden;
    }

    /* Subtle background glow */
    .hero::before {
      content: "";
      position: absolute;

      width: 600px;
      height: 600px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.055) 0%,
        rgba(255, 255, 255, 0.02) 35%,
        transparent 70%
      );

      pointer-events: none;
    }

    .hero-content {
      width: 100%;
      max-width: 820px;

      position: relative;
      z-index: 1;
    }

    .model {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      color: #aaa;

      border: 1px solid #252525;
      background: rgba(17, 17, 17, 0.9);

      padding: 8px 14px;
      border-radius: 999px;

      margin-bottom: 24px;

      font-size: 13px;
      line-height: 1;

      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.01);
    }

    .model span {
      margin-right: 6px;
      color: #fff;
    }

    h1 {
      margin: 0;

      font-size: clamp(48px, 9vw, 100px);
      line-height: 0.95;
      letter-spacing: -5px;
      font-weight: 800;
    }

    .gradient {
      display: inline-block;

      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #d8d8d8 45%,
        #777777 100%
      );

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .description {
      max-width: 680px;
      margin: 28px auto 34px;

      color: var(--muted);

      font-size: 18px;
      line-height: 1.7;
    }

    .hero-button {
      font-size: 15px;
      padding: 13px 20px;
    }

    @media (max-width: 600px) {
      nav {
        height: 64px;
        padding: 0 16px;
      }

      .logo {
        font-size: 20px;
      }

      nav .btn {
        min-height: 40px;
        padding: 9px 14px;
        font-size: 13px;
      }

      .hero {
        min-height: calc(100vh - 64px);
        padding: 45px 18px;
      }

      h1 {
        font-size: clamp(45px, 14vw, 70px);
        letter-spacing: -3px;
      }

      .description {
        margin: 24px auto 30px;
        font-size: 16px;
        line-height: 1.6;
      }

      .model {
        font-size: 12px;
        padding: 8px 12px;
      }

      .hero-button {
        width: 100%;
        max-width: 260px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .btn {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a class="logo" href="/">Codex</a>

      <a class="btn" href="/auth">
        Get Started
      </a>
    </div>
  </nav>

  <main class="hero">
    <div class="hero-content">

      <div class="model">
        <span>✦</span>
        Powered by Nemotron
      </div>

      <h1>
        Build with
        <span class="gradient">intelligence.</span>
      </h1>

      <p class="description">
        Codex adalah AI assistant untuk membantu menjawab pertanyaan,
        menulis kode, mencari ide, dan menyelesaikan pekerjaan lebih cepat.
      </p>

      <a class="btn hero-button" href="/auth">
        Start chatting →
      </a>

    </div>
  </main>

</body>
</html>
