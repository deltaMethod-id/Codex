<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Codex</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Inter, Arial, sans-serif;
    }

    nav {
      padding: 20px 30px;
      border-bottom: 1px solid #222;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin-right: 20px;
    }

    main {
      max-width: 760px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .profile {
      overflow: hidden;
      border: 1px solid #242424;
      background: #101010;
      border-radius: 18px;
    }

    .banner {
      height: 190px;
      background:
        linear-gradient(135deg, #222, #444);
      background-position: center;
      background-size: cover;
    }

    .info {
      padding: 0 30px 30px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      margin-top: -50px;
      background: #181818;
      border: 5px solid #101010;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-size: 30px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    label {
      color: #aaa;
      display: block;
      margin: 24px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      background: #090909;
      border: 1px solid #292929;
      color: white;
      border-radius: 10px;
      padding: 13px;
    }

    button {
      border: 0;
      border-radius: 9px;
      background: white;
      font-weight: bold;
      padding: 12px 20px;
      margin-top: 25px;
      cursor: pointer;
    }

    .hint {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<nav>
  <a href="/dashboard">← Dashboard</a>
  <a href="/chat">Chat</a>
</nav>

<main>
  <h1>Profile settings</h1>
  <p style="color:#888">
    Customize your Codex profile.
  </p>

  <div class="profile">
    <div class="banner" id="banner"></div>

    <div class="info">
      <div class="avatar" id="avatar">C</div>

      <label>Display name</label>
      <input id="name" type="text" maxlength="40">

      <label>Profile photo</label>
      <input id="photo" type="file" accept="image/*">

      <label>Banner</label>
      <input id="bannerFile" type="file" accept="image/*">

      <p class="hint">
        Gunakan gambar kecil. LocalStorage browser memiliki batas
        penyimpanan dan bukan tempat ideal untuk file berukuran besar.
      </p>

      <button onclick="saveProfile()">Save changes</button>
    </div>
  </div>
</main>

<script>
  let user = JSON.parse(localStorage.getItem("codex_user") || "null");

  if (!user) {
    location.href = "/auth";
  }

  const nameInput = document.getElementById("name");
  const avatar = document.getElementById("avatar");
  const banner = document.getElementById("banner");

  nameInput.value = user.name || "";

  function updatePreview() {
    if (user.photo) {
      avatar.innerHTML = `<img src="${user.photo}" alt="Profile">`;
    } else {
      avatar.textContent = (user.name || "C")[0].toUpperCase();
    }

    if (user.banner) {
      banner.style.backgroundImage = `url("${user.banner}")`;
    }
  }

  function readFile(file, callback) {
    if (!file) return;

    if (file.size > 1.5 * 1024 * 1024) {
      alert("Gunakan gambar di bawah 1.5 MB.");
      return;
    }

    const reader = new FileReader();

    reader.onload = () => callback(reader.result);
    reader.readAsDataURL(file);
  }

  document.getElementById("photo").addEventListener("change", (e) => {
    readFile(e.target.files[0], (result) => {
      user.photo = result;
      updatePreview();
    });
  });

  document.getElementById("bannerFile").addEventListener("change", (e) => {
    readFile(e.target.files[0], (result) => {
      user.banner = result;
      updatePreview();
    });
  });

  function saveProfile() {
    const name = nameInput.value.trim();

    if (!name) {
      alert("Nama tidak boleh kosong.");
      return;
    }

    user.name = name;

    try {
      localStorage.setItem("codex_user", JSON.stringify(user));
      alert("Profile saved.");
      updatePreview();
    } catch {
      alert(
        "Gagal menyimpan. Kemungkinan gambar terlalu besar untuk LocalStorage."
      );
    }
  }

  updatePreview();
</script>

</body>
</html>
