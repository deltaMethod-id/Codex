<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — Codex</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #080808;
      color: #eee;
      font-family: Inter, Arial, sans-serif;
    }

    .app {
      height: 100vh;
      display: flex;
    }

    aside {
      width: 240px;
      padding: 20px;
      background: #0c0c0c;
      border-right: 1px solid #1f1f1f;
    }

    .logo {
      font-weight: 900;
      font-size: 20px;
      margin-bottom: 30px;
    }

    aside a, aside button {
      display: block;
      width: 100%;
      color: #aaa;
      text-decoration: none;
      background: none;
      border: 0;
      text-align: left;
      padding: 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    aside a:hover, aside button:hover {
      background: #171717;
      color: #fff;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      height: 60px;
      border-bottom: 1px solid #1d1d1d;
      display: flex;
      align-items: center;
      padding: 0 25px;
      color: #aaa;
      font-size: 14px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 150px;
    }

    .message {
      max-width: 780px;
      margin: 0 auto 28px;
      display: flex;
      gap: 14px;
      line-height: 1.7;
    }

    .avatar {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      border: 1px solid #333;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 12px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .role {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #fff;
    }

    .composer-wrap {
      position: fixed;
      bottom: 0;
      left: 240px;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, #080808 30%);
    }

    .composer {
      max-width: 780px;
      margin: auto;
      border: 1px solid #303030;
      border-radius: 16px;
      background: #111;
      display: flex;
      align-items: end;
      padding: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: #fff;
      font: inherit;
      padding: 10px;
      max-height: 160px;
    }

    .send {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 20vh;
    }

    @media(max-width: 700px) {
      aside { display: none; }
      .composer-wrap { left: 0; }
    }
  </style>
</head>

<body>

<div class="app">
  <aside>
    <div class="logo">Codex</div>

    <button onclick="newChat()">＋ New chat</button>
    <a href="/dashboard">Dashboard</a>
    <a href="/settings">Settings</a>
  </aside>

  <main>
    <header>
      Nemotron 3 Ultra · OpenRouter
    </header>

    <div id="messages"></div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="Message Codex..."
        ></textarea>

        <button class="send" id="send">↑</button>
      </div>
    </div>
  </main>
</div>

<script>
  const user = JSON.parse(localStorage.getItem("codex_user") || "null");

  if (!user) {
    location.href = "/auth";
  }

  let messages = JSON.parse(
    localStorage.getItem("codex_messages") || "[]"
  );

  let loading = false;

  const messageBox = document.getElementById("messages");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");

  function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
  }

  function render() {
    if (!messages.length) {
      messageBox.innerHTML = `
        <div class="empty">
          <h2>What can I help with?</h2>
          <p>Ask Codex anything.</p>
        </div>
      `;
      return;
    }

    messageBox.innerHTML = messages.map((message) => {
      const isUser = message.role === "user";

      let avatar = isUser ? "You" : "✦";

      if (isUser && user?.photo) {
        avatar = `<img src="${escapeHTML(user.photo)}" alt="">`;
      }

      return `
        <div class="message">
          <div class="avatar">${avatar}</div>

          <div>
            <div class="role">
              ${isUser ? escapeHTML(user?.name || "You") : "Codex"}
            </div>

            <div class="content">${escapeHTML(message.content)}</div>
          </div>
        </div>
      `;
    }).join("");

    messageBox.scrollTop = messageBox.scrollHeight;
  }

  async function sendMessage() {
    const text = input.value.trim();

    if (!text || loading) return;

    messages.push({
      role: "user",
      content: text
    });

    input.value = "";
    save();
    render();

    loading = true;
    sendButton.disabled = true;

    const loadingMessage = {
      role: "assistant",
      content: "Thinking..."
    };

    messages.push(loadingMessage);
    render();

    try {
      // Jangan kirim placeholder "Thinking..." ke API.
      const apiMessages = messages.slice(0, -1);

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: apiMessages
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Request failed");
      }

      loadingMessage.content = data.content;
      save();
      render();
    } catch (error) {
      loadingMessage.content =
        "Error: " + error.message;

      save();
      render();
    } finally {
      loading = false;
      sendButton.disabled = false;
      input.focus();
    }
  }

  function save() {
    localStorage.setItem(
      "codex_messages",
      JSON.stringify(messages)
    );
  }

  function newChat() {
    if (
      messages.length &&
      !confirm("Hapus percakapan saat ini?")
    ) {
      return;
    }

    messages = [];
    localStorage.removeItem("codex_messages");
    render();
  }

  sendButton.addEventListener("click", sendMessage);

  input.addEventListener("keydown", (event) => {
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height =
      Math.min(input.scrollHeight, 160) + "px";
  });

  render();
</script>

</body>
</html>
